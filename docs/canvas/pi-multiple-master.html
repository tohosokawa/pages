<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3.14マスター</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3Eπ%3C/text%3E%3C/svg%3E">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // --- データ定義 ---
    const PI_DATA = [
      { m: 1, v: "3.14" }, { m: 2, v: "6.28" }, { m: 3, v: "9.42" },
      { m: 4, v: "12.56" }, { m: 5, v: "15.7" }, { m: 6, v: "18.84" },
      { m: 7, v: "21.98" }, { m: 8, v: "25.12" }, { m: 9, v: "28.26" },
    ];

    const DUMMIES_MAP = {
      "3.14": ["3.24", "3.04", "4.14", "3.15", "3.41"],
      "6.28": ["6.18", "6.38", "6.82", "5.28", "7.28"],
      "9.42": ["9.32", "9.52", "9.24", "8.42", "10.42"],
      "12.56": ["12.46", "12.66", "11.56", "12.65", "13.56"],
      "15.7": ["15.6", "15.8", "14.7", "16.7", "15.07"],
      "18.84": ["18.74", "18.94", "17.84", "18.48", "19.84"],
      "21.98": ["21.88", "22.08", "20.98", "21.89", "22.98"],
      "25.12": ["25.02", "25.22", "24.12", "25.21", "26.12"],
      "28.26": ["28.16", "28.36", "27.26", "28.62", "29.26"],
    };

    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    const STORAGE_KEY_USERS = 'pi_master_users';
    const STORAGE_KEY_RECORDS = 'pi_master_records';

    // --- メインコンポーネント ---
    function App() {
      const [appState, setAppState] = useState('userSelect'); 
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [newUserName, setNewUserName] = useState('');
      const [records, setRecords] = useState([]);

      const [mode, setMode] = useState('normal'); 
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [startTime, setStartTime] = useState(null);
      const [elapsedTime, setElapsedTime] = useState(0);
      const [advanceSelected, setAdvanceSelected] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [wrongChoice, setWrongChoice] = useState(null);
      const [mistakeCount, setMistakeCount] = useState(0);

      // 初期データの読み込み
      useEffect(() => {
        const savedUsers = localStorage.getItem(STORAGE_KEY_USERS);
        if (savedUsers) setUsers(JSON.parse(savedUsers));
        
        const savedRecords = localStorage.getItem(STORAGE_KEY_RECORDS);
        if (savedRecords) setRecords(JSON.parse(savedRecords));
      }, []);

      // ユーザーの保存
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
      }, [users]);

      // 記録の保存
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      }, [records]);

      // タイマー
      useEffect(() => {
        let timerId;
        if (appState === 'playing' && startTime) {
          timerId = setInterval(() => {
            setElapsedTime(Date.now() - startTime);
          }, 100);
        }
        return () => clearInterval(timerId);
      }, [appState, startTime]);

      // ゲーム終了時（appStateが'result'になった時）に記録を計算して保存
      useEffect(() => {
        if (appState === 'result' && questions.length > 0) {
          const totalSeconds = elapsedTime / 1000;
          const avgTime = totalSeconds / questions.length;
          let rank = 'C';
          
          if (avgTime <= 2.0 && mistakeCount === 0) rank = 'S';
          else if (avgTime <= 3.0 && mistakeCount <= 2) rank = 'A';
          else if (avgTime <= 4.5) rank = 'B';

          saveRecord(totalSeconds, mistakeCount, rank);
        }
      }, [appState]); 

      // ユーザー追加・削除
      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim()) return;
        if (users.includes(newUserName.trim())) {
          alert('その名前はすでにあります。');
          return;
        }
        setUsers([...users, newUserName.trim()]);
        setNewUserName('');
      };

      const handleSelectUser = (name) => {
        setCurrentUser(name);
        setAppState('menu');
      };

      const handleDeleteUser = (name, e) => {
        e.stopPropagation();
        if (window.confirm(`${name}さんを削除しますか？\n※記録は残りますが、このユーザーでのプレイができなくなります。`)) {
          setUsers(users.filter(u => u !== name));
          if (currentUser === name) setCurrentUser(null);
        }
      };

      // 記録の保存処理
      const saveRecord = (totalSeconds, mistakes, rank) => {
        const newRecord = {
          id: Date.now(),
          user: currentUser,
          date: new Date().toISOString(),
          mode: mode,
          time: totalSeconds,
          mistakes: mistakes,
          rank: rank
        };
        setRecords(prev => [...prev, newRecord]);
      };

      // ゲームロジック
      const generateQuestions = (selectedMode) => {
        let newQuestions = [];
        if (selectedMode === 'beginner') {
          const targetMultipliers = shuffleArray([1,2,3,4,5,6,7,8,9]).slice(0, 4);
          let multipliers = [];
          for(let i=0; i<10; i++) multipliers.push(targetMultipliers[i % targetMultipliers.length]);
          multipliers = shuffleArray(multipliers);

          newQuestions = multipliers.map(m => {
            const correctStr = PI_DATA.find(d => d.m === m).v;
            const dummies = shuffleArray(DUMMIES_MAP[correctStr]).slice(0, 3);
            const choices = shuffleArray([...dummies, correctStr]);
            return { type: 'normal', m, correct: correctStr, choices, isReview: false };
          });
        } else if (selectedMode === 'normal') {
          let multipliers = PI_DATA.map(d => d.m);
          multipliers.push(Math.floor(Math.random() * 9) + 1);
          multipliers = shuffleArray(multipliers);
          
          newQuestions = multipliers.map(m => {
            const correctStr = PI_DATA.find(d => d.m === m).v;
            const dummies = shuffleArray(DUMMIES_MAP[correctStr]).slice(0, 3);
            const choices = shuffleArray([...dummies, correctStr]);
            return { type: 'normal', m, correct: correctStr, choices, isReview: false };
          });
        } else {
          for(let i = 0; i < 10; i++) {
            const numAnswers = Math.random() < 0.5 ? 2 : 3;
            const correctItems = shuffleArray(PI_DATA).slice(0, numAnswers);
            const correctValues = correctItems.map(d => d.v);
            let allDummies = [];
            correctValues.forEach(v => { allDummies = allDummies.concat(DUMMIES_MAP[v]); });
            const selectedDummies = shuffleArray(allDummies).slice(0, 6 - numAnswers);
            const choices = shuffleArray([...correctValues, ...selectedDummies]);
            newQuestions.push({ type: 'advance', correctValues, choices, numAnswers, isReview: false });
          }
        }
        return newQuestions;
      };

      const startGame = (selectedMode) => {
        setMode(selectedMode);
        setQuestions(generateQuestions(selectedMode));
        setCurrentIndex(0);
        setMistakeCount(0);
        setAdvanceSelected([]);
        setFeedback(null);
        setWrongChoice(null);
        setAppState('playing');
        setStartTime(Date.now());
      };

      const handleNext = useCallback(() => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(prev => prev + 1);
          setAdvanceSelected([]);
          setFeedback(null);
        } else {
          setAppState('result');
        }
      }, [currentIndex, questions.length]);

      const handleChoiceClick = (choice) => {
        if (feedback === 'correct') return;

        const currentQ = questions[currentIndex];

        if (mode === 'normal' || mode === 'beginner') {
          if (choice === currentQ.correct) {
            setFeedback('correct');
            setTimeout(() => handleNext(), 500);
          } else {
            setWrongChoice(choice);
            setMistakeCount(prev => prev + 1);
            setQuestions(prev => {
              const newQ = { ...currentQ, isReview: true };
              const dummies = shuffleArray(DUMMIES_MAP[currentQ.correct]).slice(0, 3);
              newQ.choices = shuffleArray([...dummies, currentQ.correct]);
              return [...prev, newQ];
            });
            setTimeout(() => setWrongChoice(null), 400);
          }
        } else if (mode === 'advance') {
          if (currentQ.correctValues.includes(choice)) {
            if (!advanceSelected.includes(choice)) {
              const newSelected = [...advanceSelected, choice];
              setAdvanceSelected(newSelected);
              if (newSelected.length === currentQ.numAnswers) {
                 setFeedback('correct');
                 setTimeout(() => handleNext(), 600);
              }
            }
          } else {
            setWrongChoice(choice);
            setMistakeCount(prev => prev + 1);
            setQuestions(prev => {
              const newQ = { ...currentQ, isReview: true };
              newQ.choices = shuffleArray([...currentQ.choices]);
              return [...prev, newQ];
            });
            setTimeout(() => setWrongChoice(null), 400);
          }
        }
      };

      // --- UIコンポーネント ---
      const renderUserSelect = () => (
        <div className="flex flex-col items-center justify-center p-6 w-full space-y-8">
          <div className="text-center space-y-2">
            <h1 className="text-3xl sm:text-4xl font-extrabold text-blue-600">だれがプレイする？</h1>
            <p className="text-gray-500 font-medium">なまえをえらんでね</p>
          </div>

          <div className="w-full max-w-sm space-y-3 max-h-[40vh] overflow-y-auto p-2">
            {users.length === 0 ? (
              <div className="text-center text-gray-400 py-4 bg-gray-50 rounded-xl">まだ登録がありません</div>
            ) : (
              users.map((name, idx) => (
                <div key={idx} className="relative group">
                  <button 
                    onClick={() => handleSelectUser(name)}
                    className="w-full bg-white hover:bg-blue-50 text-gray-800 font-bold py-4 px-6 rounded-2xl shadow-sm border-2 border-gray-100 transition flex items-center gap-3"
                  >
                    <div className="bg-blue-100 p-2 rounded-full text-blue-600 text-lg">👤</div>
                    <span className="text-xl">{name}</span>
                  </button>
                  <button 
                    onClick={(e) => handleDeleteUser(name, e)}
                    className="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-xl hover:scale-110 transition"
                  >
                    🗑️
                  </button>
                </div>
              ))
            )}
          </div>

          <form onSubmit={handleAddUser} className="w-full max-w-sm bg-gray-50 p-4 rounded-2xl border border-gray-200">
            <p className="text-sm text-gray-600 font-bold mb-2">あたらしくなまえを登録</p>
            <div className="flex gap-2">
              <input 
                type="text" 
                value={newUserName}
                onChange={(e) => setNewUserName(e.target.value)}
                placeholder="なまえをいれてね"
                className="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                maxLength={10}
              />
              <button 
                type="submit"
                disabled={!newUserName.trim()}
                className="bg-blue-500 disabled:bg-blue-300 text-white p-3 rounded-xl shadow-sm text-xl flex items-center justify-center"
              >
                ➕
              </button>
            </div>
          </form>
        </div>
      );

      const renderMenu = () => (
        <div className="flex flex-col items-center justify-center space-y-6 p-6 w-full">
          <div className="w-full flex justify-between items-center bg-blue-50 px-4 py-2 rounded-full mb-2">
            <div className="flex items-center gap-2 text-blue-800 font-bold">
              <span>👤</span> {currentUser} さん
            </div>
            <button onClick={() => setAppState('userSelect')} className="text-xs text-blue-500 font-bold hover:underline">
              なまえをかえる
            </button>
          </div>

          <div className="text-center space-y-2 mb-2">
            <h1 className="text-4xl sm:text-5xl font-extrabold text-blue-600 tracking-tight drop-shadow-sm">3.14マスター</h1>
          </div>
          
          <div className="w-full max-w-sm space-y-4">
            <button 
              onClick={() => startGame('beginner')}
              className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3 border-b-4 border-green-700 active:border-b-0"
            >
              <span className="text-2xl">🔰</span>初心者モード
            </button>
            
            <button 
              onClick={() => startGame('normal')}
              className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3 border-b-4 border-blue-700 active:border-b-0"
            >
              <span className="text-2xl">▶️</span>通常モード
            </button>
            
            <button 
              onClick={() => startGame('advance')}
              className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3 border-b-4 border-orange-700 active:border-b-0"
            >
              <span className="text-2xl">🏆</span>アドバンスモード
            </button>

            <div className="h-4"></div>
            <button 
              onClick={() => setAppState('history')}
              className="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-3 px-6 rounded-2xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2 border-2 border-indigo-200"
            >
              <span className="text-xl">📊</span>成長のきろくを見る
            </button>
          </div>
        </div>
      );

      const renderPlaying = () => {
        const currentQ = questions[currentIndex];
        if (!currentQ) return null;
        const timeStr = (elapsedTime / 1000).toFixed(1);
        const isReviewMode = currentQ.isReview;

        return (
          <div className="flex flex-col items-center w-full p-4 sm:p-8">
            <div className="w-full flex justify-between items-center mb-6 text-lg font-bold text-gray-700 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100">
              <div className="flex items-center gap-2 text-blue-600">
                 <span>{currentIndex + 1} / {questions.length} 問</span>
              </div>
              <div className="flex items-center gap-2 text-orange-500 w-28 justify-end font-mono text-xl">
                <span>⏱️</span><span>{timeStr}</span>
              </div>
            </div>

            {isReviewMode && (
              <div className="mb-4 bg-red-100 text-red-600 px-4 py-1.5 rounded-full font-bold text-sm flex items-center gap-2 animate-pulse">
                <span>⚠️</span>まちがえた問題のふくしゅう！
              </div>
            )}

            <div className="text-center mb-8 h-24 flex flex-col justify-center">
              {mode === 'normal' || mode === 'beginner' ? (
                <h2 className="text-5xl sm:text-6xl font-extrabold text-gray-800 tracking-wider">
                  3.14 <span className="text-gray-400 mx-2">×</span> {currentQ.m}
                </h2>
              ) : (
                <>
                  <h2 className="text-2xl sm:text-3xl font-bold text-gray-800 leading-tight">3.14の倍数を</h2>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-blue-600 mt-2">
                    <span className="text-orange-500 text-5xl">{currentQ.numAnswers}</span> つ選ぼう！
                  </h2>
                </>
              )}
            </div>

            <div className="w-full grid grid-cols-2 gap-3 sm:gap-4 max-w-md">
              {currentQ.choices.map((choice, idx) => {
                let btnClass = "relative w-full py-6 sm:py-8 text-2xl sm:text-3xl font-bold rounded-2xl shadow-sm border-b-4 transition-all duration-100 flex items-center justify-center ";
                if (mode === 'advance' && advanceSelected.includes(choice)) {
                  btnClass += "bg-green-500 border-green-600 text-white scale-105";
                } else if (wrongChoice === choice) {
                  btnClass += "bg-red-500 border-red-600 text-white translate-y-1 scale-95 opacity-80";
                } else if (feedback === 'correct' && (mode === 'normal' || mode === 'beginner') && choice === currentQ.correct) {
                  btnClass += "bg-green-500 border-green-600 text-white scale-105 shadow-lg";
                } else {
                  btnClass += "bg-white border-gray-200 text-gray-700 hover:bg-blue-50 active:translate-y-1 active:border-b-0";
                }

                return (
                  <button
                    key={idx} onClick={() => handleChoiceClick(choice)} className={btnClass} disabled={feedback === 'correct'}
                  >
                    {choice}
                    {(mode === 'advance' && advanceSelected.includes(choice)) && (
                       <span className="absolute top-2 right-2 opacity-80 text-xl">✅</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        );
      };

      const renderResult = () => {
        const totalSeconds = elapsedTime / 1000;
        const avgTime = totalSeconds / questions.length;
        
        let rank = 'C';
        let rankColor = 'text-gray-500';
        let message = 'もっと練習して覚えよう！';

        if (avgTime <= 2.0 && mistakeCount === 0) {
          rank = 'S'; rankColor = 'text-yellow-500'; message = '神レベル！かんぺき！';
        } else if (avgTime <= 3.0 && mistakeCount <= 2) {
          rank = 'A'; rankColor = 'text-red-500'; message = 'すごい！かなり早い！';
        } else if (avgTime <= 4.5) {
          rank = 'B'; rankColor = 'text-blue-500'; message = 'よくがんばった！';
        }

        return (
          <div className="flex flex-col items-center justify-center p-6 space-y-8 w-full">
            <h2 className="text-3xl font-bold text-gray-800 mb-2">結果発表！</h2>
            
            <div className="bg-white p-6 rounded-3xl shadow-md w-full max-w-sm text-center space-y-6">
              <div className="space-y-1">
                <p className="text-gray-500 text-sm font-bold">クリアタイム</p>
                <p className="text-5xl font-extrabold text-gray-800">{totalSeconds.toFixed(1)}<span className="text-2xl text-gray-500">秒</span></p>
              </div>
              
              <div className="flex justify-around items-center pt-2">
                <div className="space-y-1">
                  <p className="text-gray-500 text-xs font-bold">解いた問題</p>
                  <p className="text-2xl font-bold text-gray-700">{questions.length} <span className="text-sm text-gray-500">問</span></p>
                </div>
                <div className="w-px h-10 bg-gray-200"></div>
                <div className="space-y-1">
                  <p className="text-gray-500 text-xs font-bold">まちがい</p>
                  <p className="text-2xl font-bold text-orange-500">{mistakeCount} <span className="text-sm text-gray-500">回</span></p>
                </div>
              </div>

              <div className="pt-4 border-t border-gray-100 bg-gray-50 -mx-6 -mb-6 p-6 rounded-b-3xl">
                <p className="text-gray-500 text-sm font-bold mb-2">総合ランク</p>
                <div className={`text-7xl font-black ${rankColor} tracking-tighter`}>{rank}</div>
                <p className="mt-3 font-bold text-gray-700 text-sm">{message}</p>
              </div>
            </div>

            <div className="w-full max-w-sm space-y-3 mt-4">
              <button 
                onClick={() => startGame(mode)}
                className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 border-b-4 border-blue-700 active:border-b-0"
              >
                <span className="text-xl">🔄</span>もう１回
              </button>
              
              <button 
                onClick={() => setAppState('menu')}
                className="w-full bg-white hover:bg-gray-50 text-gray-700 font-bold py-4 px-6 rounded-2xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2 border-2 border-gray-200"
              >
                <span className="text-xl">🏠</span>メニューへ
              </button>
            </div>
          </div>
        );
      };

      // 🚨 修正したグラフの描画部分です 🚨
      const renderHistory = () => {
        const userRecords = records.filter(r => r.user === currentUser);
        
        const renderGraph = (modeName, modeLabel) => {
          const modeRecords = userRecords.filter(r => r.mode === modeName).slice(-10);
          if (modeRecords.length === 0) return <p className="text-sm text-gray-400">まだ記録がありません</p>;

          const maxTime = Math.max(30, ...modeRecords.map(r => r.time));

          return (
            <div className="mt-4">
              <h3 className="text-sm font-bold text-gray-600 mb-2">{modeLabel} (直近10回)</h3>
              {/* flex設定を変更し、高さを少し出しました（h-40） */}
              <div className="flex gap-2 h-40 bg-gray-50 p-2 rounded-xl border border-gray-200 overflow-x-auto">
                {modeRecords.map((rec, i) => {
                  const heightPct = Math.max(10, (rec.time / maxTime) * 100);
                  let barColor = 'bg-blue-400';
                  if (rec.rank === 'S') barColor = 'bg-yellow-400';
                  if (rec.rank === 'A') barColor = 'bg-red-400';
                  
                  const date = new Date(rec.date);
                  const dateStr = `${date.getMonth()+1}/${date.getDate()}`;

                  return (
                    // height: 100% を確保して下揃えに
                    <div key={i} className="flex flex-col items-center justify-end flex-1 min-w-[30px] h-full">
                      <div className="text-[10px] text-gray-500 mb-1 font-mono">{rec.time.toFixed(0)}s</div>
                      {/* 棒自体を flex-1 (残り全部の高さ) の箱で囲む */}
                      <div className="w-full flex-1 flex items-end">
                        <div 
                          className={`w-full ${barColor} rounded-t-sm opacity-80`}
                          style={{ height: `${heightPct}%` }}
                          title={`タイム: ${rec.time.toFixed(1)}秒 / まちがい: ${rec.mistakes}回 / ランク: ${rec.rank}`}
                        ></div>
                      </div>
                      <div className="text-[10px] text-gray-400 mt-1">{dateStr}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };

        return (
          <div className="flex flex-col p-6 w-full h-full relative">
            <button 
              onClick={() => setAppState('menu')}
              className="absolute top-6 left-6 p-2 bg-white rounded-full shadow-sm text-gray-600 hover:bg-gray-50 text-xl"
            >
              ◀️
            </button>
            
            <div className="text-center mt-2 mb-6">
              <h2 className="text-2xl font-bold text-gray-800 flex items-center justify-center gap-2">
                <span>📊</span>
                {currentUser}さんの成長記録
              </h2>
            </div>

            <div className="flex-1 overflow-y-auto space-y-6 pb-6">
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                {renderGraph('beginner', '🔰 初心者モード')}
              </div>
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                {renderGraph('normal', '▶️ 通常モード')}
              </div>
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                {renderGraph('advance', '🏆 アドバンスモード')}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans touch-manipulation select-none">
          <div className="w-full max-w-lg bg-white/60 backdrop-blur-md border border-white rounded-[2.5rem] shadow-2xl overflow-hidden min-h-[650px] flex">
            {appState === 'userSelect' && renderUserSelect()}
            {appState === 'menu' && renderMenu()}
            {appState === 'playing' && renderPlaying()}
            {appState === 'result' && renderResult()}
            {appState === 'history' && renderHistory()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
